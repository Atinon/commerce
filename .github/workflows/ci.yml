name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Run test migrations
        run: npm run prisma:migrate:test

      - name: Run tests
        run: npm run test

      - name: Create dummy prod env file
        run: |
          cat > server/.env.prod <<EOF
          NODE_ENV=production
          PORT=3000
          ASSETS_BASE_URL=http://localhost:5174
          DATABASE_URL=postgresql://placeholder:placeholder@postgres:5432/placeholder
          SESSION_SECRET=placeholder
          EOF

      - name: Create dummy postgres env file
        run: |
          cat > docker/postgres.env.prod <<EOF
          POSTGRES_USER=dummy
          POSTGRES_PASSWORD=dummy
          POSTGRES_DB=dummy
          EOF

      - name: Build production images
        run: npm run prod -- build

      - name: Push production images
        run: npm run prod -- push
