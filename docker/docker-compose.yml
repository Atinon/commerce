services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - postgres.env
    volumes:
      - pgdata_dev:/var/lib/postgresql

  postgres_test:
    image: postgres:latest
    restart: unless-stopped
    ports:
      - "5433:5432"
    env_file:
      - postgres.env.test
    volumes:
      - pgdata_test:/var/lib/postgresql

volumes:
  pgdata_dev:
  pgdata_test: