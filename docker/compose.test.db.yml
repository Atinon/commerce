services:
  server:
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:latest
    restart: unless-stopped
    ports:
      - "5434:5432"
    env_file:
      - postgres.env.test
    volumes:
      - pgdata_test:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata_test:
